# Overrides on top of detekt's default config (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  TooManyFunctions:
    # A cohesive parser or layout engine legitimately gathers many small private helpers, and a
    # session view model has one small function per transport action. Splitting either to satisfy
    # a count would scatter one responsibility across two types.
    thresholdInFiles: 20
    thresholdInClasses: 14
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    # Staff layout and MusicXML element handling are long straight-line functions by
    # nature; splitting them for the metric alone would hurt readability.
    threshold: 80

style:
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 5
    excludeGuardClauses: true
  MagicNumber:
    # Music has real constants: 12 semitones, 5 staff lines, 7 letter names, 440Hz.
    # Named declarations carry their own meaning, and so do named constructor arguments and
    # enum entries — `LayoutStyle(quarterNoteWidth = StaffSpaces(3.2))` and `Whole(ticks * 4)`
    # are self-documenting, and hoisting each to a private const only moves the number further
    # from the name that explains it. Without these, the rule pushed real indirection into the
    # contract files rather than catching anything.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreAnnotated: ['Composable']

formatting:
  active: true
  android: true
